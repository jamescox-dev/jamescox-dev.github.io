    <label for="glasses-color-selector">Glasses</label><input id="glasses-color-selector" type="color" />
    <label for="dog-collar-color-selector">Dog Collar</label><input id="dog-collar-color-selector" type="color" />
    <label for="shirt-color-selector">Shirt</label><input id="shirt-color-selector" type="color" />
    <label for="jacket-color-selector">Jacket</label><input id="jacket-color-selector" type="color" />

  <button id="share-button">Send</button>

  <script>
    (function () {
      function setColor(name, value, initializeColorSelector) {
        const group = document.getElementById(name);
        group.setAttribute('fill', value);
        for (const child of group.children) {
          child.setAttribute('fill', value);
        }
        if (initializeColorSelector) {
          const colorSelector = document.getElementById(`${name}-color-selector`);
          if (colorSelector) {
            colorSelector.value = value;
            colorSelector.addEventListener('input', function (e) {
              setColor(name, event.target.value);
            });
          }
        }
      }

      const urlParams = new URLSearchParams(window.location.search);

      setColor('face', urlParams.get('face') || '#ffc7c4', true);
      setColor('hair', urlParams.get('hair') || '#f2fc24', true);
      setColor('lips', urlParams.get('lips') || '#c48081', true);
      setColor('brows', urlParams.get('brows') || '#ff6ac4', true);
      setColor('eyes', urlParams.get('eyes') || '#5078ff', true);
      setColor('glasses', urlParams.get('glasses') || '#1e74fd', true);
      setColor('dog-collar', urlParams.get('dog-collar') || '#ffffff', true);
      setColor('shirt', urlParams.get('shirt') || '#ff7dff', true);
      setColor('jacket', urlParams.get('jacket') || '#891688', true);

      document.getElementById('share-button').addEventListener('click', async function () {
        var link = window.location.href.split('?')[0];
        const urlParams = new URLSearchParams(window.location.search);
        urlParams.set('face', document.getElementById(`face-color-selector`).value);
        urlParams.set('hair', document.getElementById(`hair-color-selector`).value);
        urlParams.set('lips', document.getElementById(`lips-color-selector`).value);
        urlParams.set('brows', document.getElementById(`brows-color-selector`).value);
        urlParams.set('eyes', document.getElementById(`eyes-color-selector`).value);
        urlParams.set('glasses', document.getElementById(`glasses-color-selector`).value);
        urlParams.set('dog-collar', document.getElementById(`dog-collar-color-selector`).value);
        urlParams.set('shirt', document.getElementById(`shirt-color-selector`).value);
        urlParams.set('jacket', document.getElementById(`jacket-color-selector`).value);
        var url = link + '?' + urlParams;

        try {
          const shareData = {
            title: "The Ripple Effect",
            text: "Check out this version of the Rev!",
            url: url,
          };
          await navigator.share(shareData);
        } catch (err) {
          window.open('https://web.whatsapp.com/send?text=' + encodeURIComponent(url), '_blank');
        }
      });
    })();
  </script>
